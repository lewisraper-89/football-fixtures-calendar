name: Update Football Fixtures Calendar

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: |
          python -m pip install --upgrade pip
          pip install requests==2.31.0 ics==0.7.2

      - name: Generate calendar
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python generate_calendar.py

      - name: Commit and push calendar
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add football_fixtures.ics
          git commit -m "Update football fixtures calendar" || true
          git push

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          include_dot_files: true
